import groovy.json.JsonOutput
import java.security.MessageDigest

plugins {
    id 'java'
    id 'application'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

group = 'com.pavelkuzmin'

def appName = providers.gradleProperty('appName').getOrElse('SortIt')
def technicalName = providers.gradleProperty('technicalName').getOrElse('SortIt')
def appId = providers.gradleProperty('appId').getOrElse('f238fccc-4f33-429d-b476-7cd286adb376')
def publisher = providers.gradleProperty('publisher').getOrElse('Pavel Kuzmin')
def repositoryUrl = providers.gradleProperty('repositoryUrl').getOrElse('https://github.com/Pasha-404/sortit')
def releaseDirectory = layout.buildDirectory.dir("release/${project.version}")
def appImageDirectory = layout.buildDirectory.dir('app-image')
def appImage = layout.buildDirectory.dir("app-image/${technicalName}")
def installerFile = layout.buildDirectory.file("release/${project.version}/${technicalName}-Setup-${project.version}-x64.exe")
def checksumFile = layout.buildDirectory.file("release/${project.version}/${technicalName}-Setup-${project.version}-x64.exe.sha256")
def manifestFile = layout.buildDirectory.file("release/${project.version}/appfleet-manifest.json")

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.drewnoakes:metadata-extractor:2.18.0'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'com.pavelkuzmin.sortit.Main'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

shadowJar {
    archiveBaseName.set('sortit')
    archiveClassifier.set('')
    archiveVersion.set('')
    mergeServiceFiles()
}

tasks.register('verifyReleaseVersion') {
    doLast {
        if (!(project.version.toString() ==~ /0|[1-9]\d*\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?/)) {
            throw new GradleException("Version '${project.version}' must follow SemVer.")
        }
    }
}

tasks.register('packAppImage') {
    dependsOn tasks.shadowJar
    outputs.dir(appImage)

    doLast {
        def javaHome = System.getenv('JAVA_HOME') ?: System.getProperty('java.home')
        def jpackage = file("${javaHome}/bin/jpackage.exe")
        if (!jpackage.exists()) {
            jpackage = file("${javaHome}/bin/jpackage")
        }
        if (!jpackage.exists()) {
            throw new GradleException("jpackage was not found in ${javaHome}/bin. Use a full JDK 21 installation.")
        }

        def destination = appImageDirectory.get().asFile
        project.delete(destination)
        destination.mkdirs()

        def command = [
                jpackage.absolutePath,
                '--type', 'app-image',
                '--name', technicalName,
                '--app-version', project.version.toString(),
                '--vendor', publisher,
                '--input', layout.buildDirectory.dir('libs').get().asFile.absolutePath,
                '--dest', destination.absolutePath,
                '--main-jar', 'sortit.jar',
                '--main-class', application.mainClass.get(),
                '--add-modules', 'java.base,java.desktop',
                '--jlink-options', '--strip-debug --no-header-files --no-man-pages'
        ]

        def icon = file('src/main/resources/icons/app.ico')
        if (icon.isFile()) {
            command += ['--icon', icon.absolutePath]
        }

        project.exec {
            commandLine command
        }
    }
}

def findInnoSetupCompiler = {
    def configured = providers.gradleProperty('innoSetupCompiler').orNull ?: System.getenv('INNO_SETUP_COMPILER')
    def candidates = []
    if (configured) {
        candidates << file(configured)
    }
    [System.getenv('ProgramFiles(x86)'), System.getenv('ProgramFiles')]
            .findAll { it }
            .each { candidates << file("${it}/Inno Setup 6/ISCC.exe") }

    candidates.find { it.isFile() }
}

tasks.register('buildInnoSetup') {
    dependsOn tasks.packAppImage
    inputs.dir(appImage)
    inputs.file('installer/windows/SortIt.iss')
    outputs.file(installerFile)

    doLast {
        def iscc = findInnoSetupCompiler()
        if (iscc == null) {
            throw new GradleException('Inno Setup 6 was not found. Install it or set INNO_SETUP_COMPILER to ISCC.exe.')
        }

        def output = releaseDirectory.get().asFile
        project.delete(output)
        output.mkdirs()

        project.exec {
            commandLine iscc.absolutePath,
                    "/DAppVersion=${project.version}",
                    "/DAppName=${appName}",
                    "/DTechnicalName=${technicalName}",
                    "/DAppId=${appId}",
                    "/DPublisher=${publisher}",
                    "/DRepositoryUrl=${repositoryUrl}",
                    "/DSourceAppImage=${appImage.get().asFile.absolutePath}",
                    "/DOutputDir=${output.absolutePath}",
                    file('installer/windows/SortIt.iss').absolutePath
        }
    }
}

tasks.register('generateReleaseMetadata') {
    dependsOn tasks.buildInnoSetup
    inputs.file(installerFile)
    outputs.files(checksumFile, manifestFile)

    doLast {
        def installer = installerFile.get().asFile
        if (!installer.isFile()) {
            throw new GradleException("Inno Setup output was not found: ${installer}")
        }

        def digest = MessageDigest.getInstance('SHA-256').digest(installer.bytes)
        def checksum = digest.collect { String.format('%02x', it) }.join()
        checksumFile.get().asFile.setText("${checksum}  ${installer.name}\n", 'UTF-8')

        def manifest = [
                schemaVersion          : 1,
                appId                  : appId,
                name                   : appName,
                technicalName          : technicalName,
                version                : project.version.toString(),
                repositoryUrl          : repositoryUrl,
                platform               : 'windows',
                architecture           : 'x64',
                installer              : [
                        type           : 'inno',
                        assetName      : installer.name,
                        sha256AssetName: "${installer.name}.sha256",
                        silentArgs     : ['/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CLOSEAPPLICATIONS']
                ],
                detection              : [
                        registryKey    : "HKCU\\Software\\PashaApps\\${appId}",
                        versionValue   : 'Version',
                        executableValue: 'Executable'
                ],
                processNames           : ["${technicalName}.exe"],
                minimumAppFleetVersion : '1.0.0'
        ]
        manifestFile.get().asFile.setText(JsonOutput.prettyPrint(JsonOutput.toJson(manifest)) + '\n', 'UTF-8')
    }
}

tasks.register('buildWindowsInstaller') {
    group = 'distribution'
    description = 'Runs tests and builds the AppFleet-compatible Windows Setup EXE with metadata.'
    dependsOn tasks.verifyReleaseVersion, tasks.test, tasks.generateReleaseMetadata
}

tasks.named('build') {
    dependsOn tasks.packAppImage
}
