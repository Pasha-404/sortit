plugins {
    id 'java'
    id 'application'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

group = 'com.pavelkuzmin'
version = '1.4.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(23) // твой JDK 23
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.drewnoakes:metadata-extractor:2.18.0'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    // Главный класс приложения
    mainClass = 'com.pavelkuzmin.sortit.Main'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

shadowJar {
    archiveBaseName.set('sortit')
    archiveClassifier.set('')      // без "-all"
    archiveVersion.set('')         // без версии в имени файла
    mergeServiceFiles()
}

/**
 * Создаёт portable app-image (папка с SortIt.exe и ВСТРОЕННЫМ runtime).
 * Никаких module-info.java не нужно.
 *
 * Требования: JDK 23 (или 17+) с утилитой jpackage.
 */
tasks.register('packAppImage', Exec) {
    dependsOn tasks.shadowJar

    doFirst {
        // где лежит jpackage
        def javaHome = System.getenv('JAVA_HOME')
        if (!javaHome) javaHome = System.getProperty('java.home')
        def jpackageExe = file("${javaHome}/bin/jpackage.exe")
        if (!jpackageExe.exists()) jpackageExe = file("${javaHome}/bin/jpackage")
        if (!jpackageExe.exists()) {
            throw new GradleException("jpackage not found in ${javaHome}/bin")
        }

        def inputDir = "${buildDir}/libs"
        def destDir  = "${buildDir}/jpackage"

        // jlink-опции одной СТРОКОЙ:
        def jlinkOpts = "--strip-debug --no-header-files --no-man-pages"

        def cmd = [
                jpackageExe.absolutePath,
                '--type', 'app-image',
                '--name', 'SortIt',
                '--vendor', 'Pavel Kuzmin',
                '--app-version', project.version,
                '--input', inputDir,
                '--dest', destDir,
                '--main-jar', 'sortit.jar',
                '--main-class', application.mainClass.get(),
                '--add-modules', 'java.base,java.desktop',
                '--jlink-options', jlinkOpts
        ]

        def ico = file('src/main/resources/icons/app.ico')
        if (ico.exists()) {
            cmd += ['--icon', ico.absolutePath]
        }

        commandLine cmd
    }
}

// 1-файловый SFX через WinRAR: извлекает во временную папку и запускает SortIt.exe
tasks.register('sfxExe', Exec) {
    dependsOn tasks.packAppImage

    doFirst {
        // где WinRAR
        def wrDirs = [
                'C:/Program Files/WinRAR',
                'C:/Program Files (x86)/WinRAR'
        ].collect { new File(it) }
        File wrDir = wrDirs.find { it.exists() }
        if (wrDir == null) throw new GradleException("WinRAR не найден. Установи WinRAR или поправь путь в build.gradle")

        File winrarExe = new File(wrDir, 'WinRAR.exe')
        if (!winrarExe.exists()) throw new GradleException("WinRAR.exe не найден в ${wrDir}")

        // папка app-image от jpackage
        File appImageDir = file("$buildDir/jpackage/SortIt")
        if (!appImageDir.exists()) throw new GradleException("Нет app-image: ${appImageDir}. Сначала запусти packAppImage")

        // рабочие файлы
        File outDir = file("$buildDir/sfx")
        outDir.mkdirs()
        File comment = new File(outDir, "winrar_sfx_comment.txt")
        File outExe  = new File(outDir, "SortIt_portable.exe")

        // WinRAR SFX-скрипт
        def sfxScript = """;The comment below contains SFX script commands
TempMode
Setup=SortIt.exe
Title=SortIt
Silent=0
Overwrite=1
"""
        // пишем с указанием кодировки строкой
        comment.setText(sfxScript, "UTF-8")

        // Запаковываем ВСЁ содержимое app-image в один SFX-exe
        // a = создать архив; -sfx = самораспак.; -ep1 = без ведущих путей; -r = рекурсивно; -inul = тихо; -z = скрипт
        workingDir appImageDir
        commandLine(
                winrarExe.absolutePath,
                'a', '-sfx', '-ep1', '-r', '-inul',
                "-z${comment.absolutePath}",
                outExe.absolutePath,
                '.' // все файлы из appImageDir
        )
    }
}

// MSI-инсталлятор с UI: выбор папки, ярлыки, меню. Требуется WiX 3.x.
tasks.register('packMsi', Exec) {
    dependsOn tasks.shadowJar

    doFirst {
        // 1) Проверка WiX
        def wixDirs = [
                'C:/Program Files (x86)/WiX Toolset v3.11/bin',
                'C:/Program Files (x86)/WiX Toolset v3.14/bin',
                'C:/Program Files/WiX Toolset v3.11/bin',
                'C:/Program Files/WiX Toolset v3.14/bin'
        ].collect { new File(it) }
        File wixBin = wixDirs.find { new File(it, 'candle.exe').exists() && new File(it, 'light.exe').exists() }
        if (!wixBin) throw new GradleException("WiX Toolset не найден. Установи WiX 3.x и перезапусти.")

        // 2) jpackage
        def javaHome = System.getenv('JAVA_HOME') ?: System.getProperty('java.home')
        File jpackageExe = new File("${javaHome}/bin/jpackage.exe")
        if (!jpackageExe.exists()) jpackageExe = new File("${javaHome}/bin/jpackage")
        if (!jpackageExe.exists()) throw new GradleException("jpackage не найден в ${javaHome}/bin")

        // 3) Пути
        def inputDir = "${buildDir}/libs"
        def destDir  = "${buildDir}/jpackage"

        // 4) Иконка (опционально)
        def iconArg = []
        def ico = file('src/main/resources/icons/app.ico')
        if (ico.exists()) iconArg = ['--icon', ico.absolutePath]

        // 5) Ресурсы установщика (опционально: лицензия)
        // Если положишь файл installer/windows/license.rtf — появится экран лицензии.
        def resArgs = []
        def resDir = file('installer/windows')
        if (resDir.exists()) resArgs = ['--resource-dir', resDir.absolutePath]
        // Папка должна содержать файл license.rtf (RTF-формат)

        // 6) jlink-опции (можно убрать compress, чтобы не было предупреждения)
        def jlinkOpts = "--strip-debug --no-header-files --no-man-pages"

        // 7) Главный класс
        def mainCls = project.extensions.getByType(org.gradle.api.plugins.JavaApplication).mainClass.get()

        // 8) Команда
        def cmd = [
                jpackageExe.absolutePath,
                '--type', 'msi',
                '--name', 'SortIt',
                '--app-version', project.version,
                '--vendor', 'Pavel Kuzmin',
                '--input', inputDir,
                '--dest', destDir,
                '--main-jar', 'sortit.jar',
                '--main-class', mainCls,
                '--add-modules', 'java.base,java.desktop',
                '--jlink-options', jlinkOpts,

                // 👉 Видимый UI:
                '--win-dir-chooser',       // диалог выбора папки установки
                '--win-menu',              // пункт в меню Пуск
                '--win-menu-group', 'SortIt',
                '--win-shortcut',          // ярлык на рабочем столе
                // Убери строку выше, если ярлык на рабочем столе не нужен

                // Установка "на пользователя" (без UAC-админа). Убери, чтобы попросило админ-права и ставило в Program Files.
                '--win-per-user-install',

                // Имя папки по умолчанию (в Program Files или в %LOCALAPPDATA%\Programs)
                '--install-dir', 'SortIt'
        ] + iconArg + resArgs

        // WiX в PATH на время задачи
        environment 'PATH', wixBin.absolutePath + File.pathSeparator + System.getenv('PATH')

        commandLine cmd
    }
}


// чтобы обычный Build сразу делал exe-образ
tasks.named('build') {
    dependsOn tasks.packAppImage
}
