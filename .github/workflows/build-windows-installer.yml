name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    branches:
      - master
    tags:
      - 'v*'
    paths:
      - '.github/workflows/build-windows-installer.yml'
      - 'build.gradle'
      - 'gradle.properties'
      - 'settings.gradle'
      - 'gradle/**'
      - 'gradlew.bat'
      - 'installer/windows/**'
      - 'src/**'

jobs:
  build-windows-installer:
    name: Build Windows Setup EXE
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Inno Setup 6
        shell: powershell
        run: choco install innosetup -y --no-progress

      - name: Build installer and release metadata
        shell: cmd
        run: gradlew.bat clean buildWindowsInstaller

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: SortIt-windows-release
          path: build/release/*/*
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-windows-installer
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v5
        with:
          name: SortIt-windows-release
          path: release

      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(release/*)
          test "${#assets[@]}" -eq 3

          gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "SortIt ${GITHUB_REF_NAME#v}" \
            --notes "Windows installer standard: per-user x64 Setup EXE with embedded Java 21 runtime. Settings are stored in %APPDATA%\\PashaApps\\SortIt and logs in %LOCALAPPDATA%\\PashaApps\\SortIt. This update migrates settings from published SortIt MSI releases before removing the old installer." \
            --latest
